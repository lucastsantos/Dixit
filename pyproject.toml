[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Dixit"
version = "0.1.3"
description = "Fan-created server for the board game Dixit"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.13"
license = "LicenseRef-Dixit-Personal-Use"
authors = [{ name = "Aaron Voelker", email = "arvoelke@gmail.com" }]
dependencies = ["tornado"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.urls]
Homepage = "https://github.com/arvoelke/Dixit/"

[project.scripts]
dixit = "dixit:start"

[dependency-groups]
dev = ["pytest", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["dixit*"]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88

[tool.ruff.format]
# defaults are black-compatible
